[package]
name = "kora"
version = "0.1.0"
description = "Kora — one terminal, every agent"
authors = ["Kora"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
# Images reach the agent as base64 in its own protocol's image blocks.
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
